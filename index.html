<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090a;
    --bg2:#0e1210;
    --fg:#3dff6e;
    --fg-dim:#1c7a37;
    --amber:#ffb000;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    min-height:100%;
    margin:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 75%);
    color:var(--fg);
    font-family:'VT323', monospace;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 40px;
    padding-top:calc(28px + env(safe-area-inset-top,0px));
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  }
  .heading{ font-family:'Press Start 2P', monospace; }
  h1{
    font-size:clamp(20px,6vw,34px);
    letter-spacing:5px;
    margin:0;
    color:var(--fg);
    text-shadow:0 0 10px var(--fg-dim), 0 0 24px var(--fg-dim);
  }
  .tagline{
    font-size:16px;
    color:var(--amber);
    letter-spacing:2px;
    margin:6px 0 26px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,260px));
    gap:22px;
    justify-content:center;
    width:100%;
    max-width:640px;
  }
  .card{
    font-family:inherit;
    color:var(--fg);
    background:linear-gradient(180deg,#0d130f,#080b09);
    border:2px solid var(--fg);
    border-radius:8px;
    box-shadow:0 0 0 4px var(--bg), 0 0 16px var(--fg-dim);
    padding:20px 16px 18px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    transition:transform .12s ease, box-shadow .12s ease;
    text-decoration:none;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 0 0 4px var(--bg), 0 0 26px var(--amber);
    outline:none;
    border-color:var(--amber);
    color:var(--amber);
  }
  .icon{ width:64px; height:64px; }
  .icon svg{ width:100%; height:100%; }
  .card h2{
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    letter-spacing:1px;
    margin:0;
    text-align:center;
  }
  .card p{
    font-size:15px;
    color:var(--fg-dim);
    margin:0;
    text-align:center;
    line-height:1.35;
  }
  .card .play{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    letter-spacing:2px;
    color:var(--amber);
    margin-top:2px;
  }
  .hidden{ display:none !important; }

  /* ---- Age gate ---- */
  #ageGate{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(3,4,3,0.9);
    padding:20px;
  }
  #ageGate .box{
    background:linear-gradient(180deg,#0d130f,#080b09);
    border:2px solid var(--fg);
    border-radius:8px;
    box-shadow:0 0 0 4px var(--bg), 0 0 20px var(--fg-dim);
    padding:24px 22px;
    max-width:320px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
  }
  #ageGate h2{ font-size:13px; letter-spacing:1px; margin:0; color:var(--amber); }
  #ageGate p{ font-size:15px; margin:0; line-height:1.4; }
  #ageGate input[type="date"]{
    font-family:'VT323', monospace;
    font-size:18px;
    padding:8px 10px;
    background:var(--bg);
    border:2px solid var(--fg);
    color:var(--fg);
    border-radius:4px;
    width:100%;
  }
  #ageGate .btnRow{ display:flex; gap:10px; width:100%; }
  #ageGate button{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    letter-spacing:1px;
    padding:10px 8px;
    border-radius:4px;
    cursor:pointer;
    flex:1;
    border:2px solid var(--fg);
  }
  #ageGate #dobSubmit{ background:var(--fg); color:var(--bg); }
  #ageGate #dobCancel{ background:var(--bg); color:var(--fg-dim); border-color:var(--fg-dim); }
  #ageGate #dobError{ color:#ff5252; font-size:14px; margin:0; }
</style>
</head>
<body>

<h1 class="heading">VIBE ARCADE</h1>
<div class="tagline">CLICK OR TAP A TILE TO PLAY</div>

<div class="grid">
  <a class="card" href="paddle-ball.html">
    <div class="icon">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="6" fill="#ffb000"/><rect x="14" y="46" width="36" height="8" rx="2" fill="#3dff6e"/></svg>
    </div>
    <h2 class="heading">PADDLE<br>BALL</h2>
    <p>Don't let it drop.</p>
    <div class="play">▶ PLAY</div>
  </a>

  <a class="card" href="jaggy-snake.html">
    <div class="icon">
      <svg viewBox="0 0 64 64"><rect x="10" y="30" width="10" height="10" fill="#28331c"/><rect x="20" y="30" width="10" height="10" fill="#28331c"/><rect x="30" y="30" width="10" height="10" fill="#28331c"/><rect x="30" y="20" width="10" height="10" fill="#28331c"/><rect x="44" y="20" width="10" height="10" fill="#d94f4f"/></svg>
    </div>
    <h2 class="heading">JAGGY<br>SNAKE</h2>
    <p>Grow long, avoid yourself,<br>chase the high score.</p>
    <div class="play">▶ PLAY</div>
  </a>

  <button class="card" id="undeadCard" type="button">
    <div class="icon">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="27" r="15" fill="#5f7248"/>
        <rect x="19" y="40" width="26" height="17" rx="3" fill="#4a3a30"/>
        <rect x="24" y="21" width="6" height="6" fill="#000"/>
        <rect x="34" y="21" width="6" height="6" fill="#000"/>
        <circle cx="27" cy="24" r="1.6" fill="#f33"/>
        <circle cx="37" cy="24" r="1.6" fill="#f33"/>
        <rect x="26" y="33" width="12" height="3" fill="#1a0505"/>
      </svg>
    </div>
    <h2 class="heading">UNDEAD<br>UNDOING</h2>
    <p>Shoot 'em, bash 'em, hold<br>on to your brains.</p>
    <div class="play">▶ PLAY</div>
  </button>
</div>

<div id="ageGate" class="hidden">
  <div class="box">
    <h2 class="heading">AGE CHECK</h2>
    <p>You must be 18 or older to play UNDEAD UNDOING.<br>Please enter your date of birth.</p>
    <input type="date" id="dobInput">
    <p id="dobError" class="hidden">You must be over 18 to play this game</p>
    <div class="btnRow">
      <button id="dobCancel" type="button">CANCEL</button>
      <button id="dobSubmit" type="button">CONTINUE</button>
    </div>
  </div>
</div>

<script>
(function(){
  const ageGate = document.getElementById('ageGate');
  const dobInput = document.getElementById('dobInput');
  const dobError = document.getElementById('dobError');
  const dobSubmit = document.getElementById('dobSubmit');
  const dobCancel = document.getElementById('dobCancel');
  const undeadCard = document.getElementById('undeadCard');

  function isAdult(dobValue){
    const dob = new Date(dobValue + 'T00:00:00');
    if (isNaN(dob.getTime())) return false;
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const monthDiff = today.getMonth() - dob.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
      age--;
    }
    return age >= 18;
  }

  function openAgeGate(){
    dobInput.value = '';
    dobError.classList.add('hidden');
    ageGate.classList.remove('hidden');
    setTimeout(() => dobInput.focus(), 50);
  }
  function closeAgeGate(){
    ageGate.classList.add('hidden');
  }

  undeadCard.addEventListener('click', openAgeGate);
  dobCancel.addEventListener('click', closeAgeGate);
  dobSubmit.addEventListener('click', () => {
    if (!dobInput.value || !isAdult(dobInput.value)) {
      dobError.classList.remove('hidden');
      return;
    }
    closeAgeGate();
    window.location.href = 'undead-undoing.html';
  });
})();
</script>
</body>
</html>
